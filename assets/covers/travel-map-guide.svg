    <text x="390" y="320">02</text>
    <text x="575" y="406">03</text>
    <text x="736" y="482">04</text>
    <text x="894" y="474">05</text>
    <text x="1012" y="404">06</text>
  </g>
  <g fill="#143c68" font-family="Arial, sans-serif" font-weight="700">
    <text x="164" y="180" font-size="34">Travel Map</text>
