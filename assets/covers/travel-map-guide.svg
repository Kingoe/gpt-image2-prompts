<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">旅行地图海报封面</title>
  <desc id="desc">明亮旅行地图、路线标记和景点卡片风格的占位封面</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f6fbff"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1b4b7a" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="800" rx="46" fill="url(#bg)"/>
  <path d="M0 590 C170 520 260 650 420 580 S700 510 860 600 1090 590 1200 520 V800 H0Z" fill="#d8f0ff"/>
  <path d="M122 188 C278 104 455 132 582 222 C713 315 854 294 1030 196" fill="none" stroke="#bfddc7" stroke-width="26" stroke-linecap="round" opacity=".72"/>
  <path d="M150 316 C318 260 462 315 594 405 S853 526 1034 422" fill="none" stroke="#2c74bd" stroke-width="14" stroke-linecap="round" stroke-dasharray="32 24"/>
  <g filter="url(#shadow)">
    <rect x="116" y="116" width="288" height="170" rx="28" fill="#fff" opacity=".9"/>
    <rect x="796" y="112" width="292" height="174" rx="28" fill="#fff" opacity=".9"/>
    <rect x="122" y="494" width="300" height="174" rx="28" fill="#fff" opacity=".9"/>
    <rect x="780" y="500" width="306" height="170" rx="28" fill="#fff" opacity=".9"/>
  </g>
  <g fill="#1b65ad">
    <circle cx="206" cy="350" r="34"/>
    <circle cx="390" cy="308" r="34"/>
    <circle cx="575" cy="394" r="34"/>
    <circle cx="736" cy="470" r="34"/>
    <circle cx="894" cy="462" r="34"/>
    <circle cx="1012" cy="392" r="34"/>
  </g>
  <g fill="#fff" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle">
