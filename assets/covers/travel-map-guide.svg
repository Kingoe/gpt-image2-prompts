    <text x="842" y="178" font-size="31">Route Guide</text>
    <text x="842" y="222" font-size="22" opacity=".66">bright infographic</text>
    <text x="172" y="562" font-size="30">Spot Cards</text>
    <text x="172" y="604" font-size="22" opacity=".66">tips + photo points</text>
